[package]
name = "bao"
version = "0.1.0"
description = "Device-bound red packets for Seeker"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "bao"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["token", "token_2022", "associated_token", "token_2022_extensions"] }
ephemeral-rollups-sdk = { version = "0.17.3", features = ["anchor", "vrf"] }
solana-sha256-hasher = "3.1"
spl-pod = "0.7"
spl-token-2022-interface = "2"
spl-token-group-interface = "0.7"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.2"
solana-signature = "3.1"
proptest = "1"
spl-token-interface = "2"
spl-associated-token-account-interface = "2"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
